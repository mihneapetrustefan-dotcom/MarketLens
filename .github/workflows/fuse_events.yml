name: Fuse Events (Phase 5)

# Rulare MANUALA. Ruleaza fuziunea de evenimente peste rapoartele
# scrise de Faza 4: blocking -> scoring -> decizie -> merge ->
# corroborare -> contradictii -> cronologie, si scrie evenimentele
# canonice rezultate.
#
# Ruleaza DUPA Populate Events (Phase 4). Faza 4 scrie la nivel de
# RAPORT (un rand per articol-tip); colapsarea in evenimente canonice
# se face aici — asta e chiar rostul fazei.
#
# Masurat pe corpusul real: 846 rapoarte -> 581 evenimente canonice,
# +1.15 MB. Rezultatul e reproductibil: verificat identic sub patru
# valori diferite de PYTHONHASHSEED.
#
# Sigur de rulat repetat: id-urile canonice sunt derivate determinist
# din setul de rapoarte fuzionate, iar randurile ramase din rulari
# anterioare sunt curatate explicit. Rapoartele din `events` nu sunt
# niciodata modificate sau sterse de fuziune.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Cate rapoarte (cele mai recente) sa fuzioneze. Gol = toate.'
        required: false
        default: ''
      max_db_mb:
        description: 'Prag de siguranta MB. Baza traieste intr-un Release asset (limita 2 GB), NU in git (limita 100 MB) - pragul prinde cresterea scapata de sub control, nu plafonul vechi al repo-ului.'
        required: false
        default: '1400'

permissions:
  contents: write

concurrency:
  group: marketlens-data-write
  cancel-in-progress: false

jobs:
  fuse-events:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download database from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data
          # Reincearca: 'gh release upload --clobber' dintr-un alt
          # workflow sterge asset-ul vechi INAINTE sa incarce pe cel
          # nou, deci exista o fereastra scurta (de obicei sub un
          # minut) in care asset-ul nu exista deloc. O descarcare care
          # nimereste exact acea fereastra primeste "no assets to
          # download" si esueaza imediat, desi nu e o eroare reala —
          # doar o coliziune de timing intre doua workflow-uri care
          # ruleaza acum in paralel (fiecare in propriul grup de
          # concurenta). 5 incercari la 15s acopera confortabil golul.
          success=0
          for i in 1 2 3 4 5; do
            if gh release download db-latest --repo ${{ github.repository }} --pattern 'marketlens.db' --dir data/ --clobber; then
              success=1
              break
            fi
            echo "Descarcare esuata (posibil upload concurent in desfasurare) — reincerc in 15s ($i/5)..."
            sleep 15
          done
          if [ "$success" != "1" ]; then
            echo "EROARE: nu am putut descarca baza dupa 5 incercari."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run fusion (dry run first, always logged)
        run: |
          ARGS="--max-db-mb ${{ github.event.inputs.max_db_mb }}"
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"
          fi
          echo "=== DRY RUN ==="
          python scripts/fuse_events.py $ARGS
          echo "=== APPLY ==="
          python scripts/fuse_events.py $ARGS --apply

      - name: Upload updated database to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload db-latest data/marketlens.db --repo ${{ github.repository }} --clobber
