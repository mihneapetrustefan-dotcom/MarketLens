name: Backfill Article Entities (Phase 3)

# Rulare MANUALA. Rezolva mentiunile de companii/tickere din tabela
# `articles` existenta in legaturi canonice `article_entities`, fara
# sa duplice corpusul in `news_articles` (vezi comentariul din
# scripts/backfill_article_entities.py pentru motiv).
#
# Implicit: TOT corpusul, prag de siguranta 1400 MB.
#
# Implicitul era 30.000 de articole (cele mai recente). Masurat pe
# corpusul din 2026-09: 22.141 din cele mai recente 30.000 erau deja
# legate, iar cele 15.276 de articole NELEGATE erau mai vechi, in afara
# ferestrei. Un backfill al carui rost e sa lichideze restanta sarea
# exact restanta.
#
# Pragul era 96 MB, ales ca sa lase loc sub plafonul GitHub de 100 MiB
# pentru fisiere din repo. Baza NU mai traieste in repo: a fost mutata
# intr-un Release asset (limita 2 GB) de
# .github/workflows/migrate_db_to_release.yml, exact ca sa scape de
# acel plafon. Pragul vechi a supravietuit motivului lui si a blocat
# in tacere fiecare rulare de cand baza a depasit ~96 MB.
#
# Sigur de rulat repetat: scrierile sunt INSERT OR IGNORE, deci o
# rulare ulterioara peste randuri deja existente nu adauga nimic.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Cate articole (cele mai recente) sa proceseze. Gol sau 0 = tot corpusul (implicit).'
        required: false
        default: '0'
      max_db_mb:
        description: 'Prag de siguranta MB. Baza traieste intr-un Release asset (limita 2 GB), NU in git (limita 100 MB) - pragul prinde cresterea scapata de sub control, nu plafonul vechi al repo-ului.'
        required: false
        default: '1400'
      since:
        description: 'Optional: doar articole publicate de la aceasta data ISO incolo (ex: 2026-01-01).'
        required: false
        default: ''

permissions:
  contents: write

# Acelasi grup ca in daily.yml: backfill-ul si pipeline-ul zilnic
# scriu amandoua in data/marketlens.db si fac push. Fara acest grup,
# o rulare manuala in paralel cu pipeline-ul zilnic ar putea produce
# un conflict de commit sau, mai rau, o cursa pe acelasi fisier.
concurrency:
  group: marketlens-data-write
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download database from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data
          # Reincearca: 'gh release upload --clobber' dintr-un alt
          # workflow sterge asset-ul vechi INAINTE sa incarce pe cel
          # nou, deci exista o fereastra scurta (de obicei sub un
          # minut) in care asset-ul nu exista deloc. O descarcare care
          # nimereste exact acea fereastra primeste "no assets to
          # download" si esueaza imediat, desi nu e o eroare reala —
          # doar o coliziune de timing intre doua workflow-uri care
          # ruleaza acum in paralel (fiecare in propriul grup de
          # concurenta). 5 incercari la 15s acopera confortabil golul.
          success=0
          for i in 1 2 3 4 5; do
            if gh release download db-latest --repo ${{ github.repository }} --pattern 'marketlens.db' --dir data/ --clobber; then
              success=1
              break
            fi
            echo "Descarcare esuata (posibil upload concurent in desfasurare) — reincerc in 15s ($i/5)..."
            sleep 15
          done
          if [ "$success" != "1" ]; then
            echo "EROARE: nu am putut descarca baza dupa 5 incercari."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backfill (dry run first, always logged)
        run: |
          ARGS="--max-db-mb ${{ github.event.inputs.max_db_mb }}"
          # Gol SI 0 inseamna amandoua "tot corpusul". Celelalte
          # workflow-uri din lant folosesc 0; acesta folosea doar sirul
          # gol, deci aceeasi intentie dadea rezultate diferite.
          LIMIT="${{ github.event.inputs.limit }}"
          if [ -n "$LIMIT" ] && [ "$LIMIT" != "0" ]; then
            ARGS="$ARGS --limit $LIMIT"
          fi
          if [ -n "${{ github.event.inputs.since }}" ]; then
            ARGS="$ARGS --since ${{ github.event.inputs.since }}"
          fi
          echo "=== DRY RUN ==="
          python scripts/backfill_article_entities.py $ARGS
          echo "=== APPLY ==="
          python scripts/backfill_article_entities.py $ARGS --apply

      - name: Upload updated database to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload db-latest data/marketlens.db --repo ${{ github.repository }} --clobber
