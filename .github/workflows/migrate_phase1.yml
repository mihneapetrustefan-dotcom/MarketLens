name: Phase 1 - Migrate Registries to Canonical Tables

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: marketlens-data-write
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download database from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data
          gh release download db-latest --repo ${{ github.repository }} --pattern 'marketlens.db' --dir data/ --clobber

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Phase 1 migration
        run: python scripts/migrate_registries_to_canonical.py

      - name: Upload updated database to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload db-latest data/marketlens.db --repo ${{ github.repository }} --clobber
