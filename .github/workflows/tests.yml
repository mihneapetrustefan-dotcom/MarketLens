name: Tests

# Rulează toată suita de teste la fiecare push/pull request pe main —
# ca o regresie introdusă printr-o modificare de cod să fie prinsă
# ÎNAINTE să ajungă să ruleze automat în producție.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # -t . fixează directorul top-level la rădăcina repo-ului.
      # Fără el, tests/scripts/ ar fi importat ca pachetul top-level
      # `scripts`, umbrind directorul scripts/ real din rădăcină.
      - name: Run full test suite
        run: PYTHONPATH=src python -m unittest discover -s tests -t . -v
      - name: Check company registry for collisions
        run: PYTHONPATH=src python src/check_registry_collisions.py
