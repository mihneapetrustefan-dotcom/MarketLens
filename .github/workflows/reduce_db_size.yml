name: EMERGENCY - Reduce Database Size

# Rulare MANUALA, o singura data (sau ori de cate ori baza de date se
# apropie iar de limita GitHub de 100 MB) — micsoreaza data/marketlens.db
# stergand payload-urile brute vechi (Faza 2) si rulind VACUUM.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: marketlens-data-write
  cancel-in-progress: false

jobs:
  reduce:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download database from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data
          gh release download db-latest --repo ${{ github.repository }} --pattern 'marketlens.db' --dir data/ --clobber

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Reduce database size
        run: python scripts/reduce_database_size.py

      - name: Upload the smaller database to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload db-latest data/marketlens.db --repo ${{ github.repository }} --clobber
