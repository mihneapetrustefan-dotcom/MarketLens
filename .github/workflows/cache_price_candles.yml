name: Cache Price Candles (Phase 6, step 1)

# Rulare MANUALA. Aduce si stocheaza in cache candele Polygon.io
# (zilnice si pe minute) pentru instrumentul principal al fiecarui
# eveniment canonic. Nu calculeaza niciun studiu de impact — doar
# pregateste datele de pret de care Phase 6 are nevoie, o singura
# data, ca sa nu depinda de un apel live de fiecare data cand se
# recalculeaza un studiu (vezi docstring-ul scriptului pentru motiv).
#
# ATENTIE LA DURATA: nivelul gratuit Polygon permite 5 cereri/minut.
# Pe corpusul actual (244 instrumente distincte) rularea completa
# face ~760 cereri si dureaza aproximativ 2-3 ORE. Foloseste
# limit_instruments pentru un test rapid inainte de rularea completa.
#
# Necesita secretul POLYGON_API_KEY (cont gratuit, fara card, pe
# polygon.io sau massive.com).
on:
  workflow_dispatch:
    inputs:
      limit_instruments:
        description: '0 = fara limita (proceseaza toate ~244 instrumente, ~2-3 ore). N = test rapid pe primele N.'
        required: false
        default: '5'
      skip_minute:
        description: 'true = doar candele zilnice, sare peste cele pe minute (mult mai rapid).'
        required: false
        default: 'false'
      dry_run:
        description: 'true = arata planul de cereri fara sa apeleze Polygon sau sa scrie.'
        required: false
        default: 'true'

permissions:
  contents: write

concurrency:
  group: marketlens-data-write
  cancel-in-progress: false

jobs:
  cache-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download database from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data
          # Reincearca: 'gh release upload --clobber' dintr-un alt
          # workflow sterge asset-ul vechi INAINTE sa incarce pe cel
          # nou, deci exista o fereastra scurta (de obicei sub un
          # minut) in care asset-ul nu exista deloc. O descarcare care
          # nimereste exact acea fereastra primeste "no assets to
          # download" si esueaza imediat, desi nu e o eroare reala —
          # doar o coliziune de timing intre doua workflow-uri care
          # ruleaza acum in paralel (fiecare in propriul grup de
          # concurenta). 5 incercari la 15s acopera confortabil golul.
          success=0
          for i in 1 2 3 4 5; do
            if gh release download db-latest --repo ${{ github.repository }} --pattern 'marketlens.db' --dir data/ --clobber; then
              success=1
              break
            fi
            echo "Descarcare esuata (posibil upload concurent in desfasurare) — reincerc in 15s ($i/5)..."
            sleep 15
          done
          if [ "$success" != "1" ]; then
            echo "EROARE: nu am putut descarca baza dupa 5 incercari."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache price candles
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: |
          ARGS=""
          # GitHub reaplica valoarea 'default' din YAML cand campul e
          # lasat gol in formular (nu trimite un sir gol) — deci "gol
          # = fara limita" nu poate functiona niciodata prin interfata
          # web. 0 este sentinela explicita pentru "fara limita".
          if [ "${{ github.event.inputs.limit_instruments }}" != "0" ]; then
            ARGS="$ARGS --limit-instruments ${{ github.event.inputs.limit_instruments }}"
          fi
          if [ "${{ github.event.inputs.skip_minute }}" = "true" ]; then
            ARGS="$ARGS --skip-minute"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python scripts/cache_price_candles.py $ARGS

      - name: Upload updated database to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload db-latest data/marketlens.db --repo ${{ github.repository }} --clobber
