name: MarketLens Daily Pipeline

# Ruleaza de 5 ori pe zi, aliniat cu orele bursei americane (Eastern
# Time). Orele de mai jos sunt calculate pentru EST (ora standard de
# iarna, UTC-5) — vara (EDT, UTC-4), din cauza schimbarii orei,
# rularile vor cadea cu o ora mai devreme fata de intentia initiala.
#
#   1. Inainte de deschidere (9:00 ET / 14:00 UTC)
#   2. Pranz (12:00 ET / 17:00 UTC)
#   3. Ora 15:00 (15:00 ET / 20:00 UTC)
#   4. Imediat dupa inchidere (16:15 ET / 21:15 UTC)
#   5. Miezul noptii (00:00 ET / 05:00 UTC)
on:
  schedule:
    - cron: '0 14 * * *'
    - cron: '0 17 * * *'
    - cron: '0 20 * * *'
    - cron: '15 21 * * *'
    - cron: '0 5 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: marketlens-data-write
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily pipeline
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python run_daily.py

      # ARE DOI PASI, in ordinea asta — primul rezolva sursa reala de
      # bloat (tabelul 'articles', arhivat pe luni, niciodata sters
      # din istoric), al doilea e o plasa de siguranta suplimentara
      # (raw_articles, daca vreodata e populat). Ruleaza la FIECARE
      # rulare, inainte de commit.
      - name: Archive old articles (preserves history, shrinks live DB)
        run: python scripts/archive_old_articles.py --keep-days 180

      - name: Keep database size under control (safety net)
        run: python scripts/reduce_database_size.py --keep-days 14

      - name: Commit and push updated data + report
        run: |
          git config user.name "marketlens-bot"
          git config user.email "actions@github.com"
          git add data/ docs/
          git diff --staged --quiet || git commit -m "Actualizare automata $(date -u +'%Y-%m-%d %H:%M UTC')"

          if git pull --rebase origin main; then
            git push
          else
            echo "Conflict la rebase — pastram versiunea proaspat generata de aceasta rulare."
            git rebase --abort || true
            git fetch origin main
            git merge -X ours origin/main --no-edit -m "Merge automat (rezolvare conflict pe fisiere regenerate)"
            git push
          fi
