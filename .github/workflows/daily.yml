name: MarketLens Daily Pipeline

# Ruleaza de 3 ori pe zi, aliniat cu bursa americana.
#
# GitHub Actions interpreteaza cron DOAR in UTC si nu urmareste ora de
# vara. Orele de mai jos sunt alese ca sa fie corecte in AMBELE regimuri
# (EDT = UTC-4 vara, EST = UTC-5 iarna), nu doar iarna:
#
#   1. Inainte de deschidere — 13:00 UTC (9:00 EDT / 8:00 EST)
#      Deschiderea e la 9:30 ET, adica 13:30 UTC vara si 14:30 iarna.
#      13:00 UTC ramane inaintea ei tot anul.
#   2. Pranz              — 16:30 UTC (12:30 EDT / 11:30 EST)
#   3. Dupa inchidere     — 21:15 UTC (17:15 EDT / 16:15 EST)
#      Inchiderea e la 16:00 ET, adica 20:00 UTC vara si 21:00 iarna.
#      21:15 UTC ramane dupa ea tot anul.
#
# Redus de la 5 la 3 rulari pentru a incetini cresterea bazei de date.
# Eliminate: rularea de la 15:00 ET si cea de la miezul noptii.
on:
  schedule:
    - cron: '0 13 * * *'
    - cron: '30 16 * * *'
    - cron: '15 21 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  # Grup DEDICAT, separat de 'marketlens-data-write' folosit de toate
  # celelalte workflow-uri (Fazele 3-7, arhivare, reducere baza).
  #
  # Motiv: acest pipeline ruleaza de 3 ori pe zi si trebuie sa ramana
  # la timp. Daca ar imparti grupul cu rulari manuale de cercetare
  # care dureaza ore intregi (ex. Cache Price Candles, ~2-3 ore),
  # GitHub Actions pastreaza in coada DOAR cea mai recenta rulare in
  # asteptare si anuleaza automat orice rulare anterioara neinceputa
  # din acelasi grup. Rezultat masurat: in timpul unei capturi de
  # preturi de 2h38m, pipeline-ul zilnic nu a mai rulat deloc timp de
  # aproape 20 de ore — nu intarziat, ci sarit complet din coada.
  #
  # Riscul ramas, acceptat constient: daca acest pipeline si un
  # workflow de cercetare ar rula chiar in aceeasi secunda, ambele
  # ar scrie in acelasi asset din Release si ultimul care termina ar
  # suprascrie rezultatul celuilalt. Este un risc mic (rularile de
  # cercetare sunt declansate manual, ocazional) si recuperabil
  # (re-rulare simpla), spre deosebire de a rata actualizari zilnice
  # timp de o zi intreaga.
  group: marketlens-daily-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download database from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data
          # Reincearca: 'gh release upload --clobber' dintr-un alt
          # workflow sterge asset-ul vechi INAINTE sa incarce pe cel
          # nou, deci exista o fereastra scurta (de obicei sub un
          # minut) in care asset-ul nu exista deloc. O descarcare care
          # nimereste exact acea fereastra primeste "no assets to
          # download" si esueaza imediat, desi nu e o eroare reala —
          # doar o coliziune de timing intre doua workflow-uri care
          # ruleaza acum in paralel (fiecare in propriul grup de
          # concurenta). 5 incercari la 15s acopera confortabil golul.
          success=0
          for i in 1 2 3 4 5; do
            if gh release download db-latest --repo ${{ github.repository }} --pattern 'marketlens.db' --dir data/ --clobber; then
              success=1
              break
            fi
            echo "Descarcare esuata (posibil upload concurent in desfasurare) — reincerc in 15s ($i/5)..."
            sleep 15
          done
          if [ "$success" != "1" ]; then
            echo "EROARE: nu am putut descarca baza dupa 5 incercari."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily pipeline
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python run_daily.py

      # Sincronizeaza tabela canonica `news_articles` cu articolele
      # nou colectate (Faza 17, TD-02).
      #
      # Ruleaza DUPA pipeline si INAINTE de arhivare: articolele scoase
      # din baza vie la aceeasi rulare sunt deja in tabela canonica.
      #
      # continue-on-error e deliberat. Scriptul e idempotent, deci o
      # zi ratata se recupereaza singura la rularea urmatoare. In
      # schimb, un pipeline zilnic rosu care nu mai colecteaza stiri
      # pierde date definitiv. Sincronizarea nu merita acel risc.
      - name: Sync canonical news table (TD-02)
        continue-on-error: true
        run: python scripts/migrate_news_to_canonical.py

      # Fereastra de 60 de zile (nu 180): diagnosticul a aratat ca
      # aproape tot volumul provine din articole RECENTE, generate de
      # rularile zilnice — o fereastra de 180 de zile elibera doar 87
      # de articole. Istoricul NU se pierde: tot ce depaseste 60 de
      # zile ajunge in data/archives/, comprimat si complet.
      - name: Archive old articles (preserves history, shrinks live DB)
        run: python scripts/archive_old_articles.py --keep-days 60

      - name: Keep database size under control (safety net)
        run: python scripts/reduce_database_size.py --keep-days 14

      - name: Upload updated database to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload db-latest data/marketlens.db --repo ${{ github.repository }} --clobber

      - name: Commit and push report + archive files (not the database)
        run: |
          git config user.name "marketlens-bot"
          git config user.email "actions@github.com"
          git add data/archives/ docs/
          git diff --staged --quiet || git commit -m "Actualizare automata $(date -u +'%Y-%m-%d %H:%M UTC')"

          if git pull --rebase origin main; then
            git push
          else
            echo "Conflict la rebase — pastram versiunea proaspat generata de aceasta rulare."
            git rebase --abort || true
            git fetch origin main
            git merge -X ours origin/main --no-edit -m "Merge automat (rezolvare conflict pe fisiere regenerate)"
            git push
          fi
