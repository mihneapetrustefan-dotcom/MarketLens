name: MarketLens Daily Pipeline

# Rulează de 5 ori pe zi, aliniat cu orele bursei americane (Eastern
# Time), plus la miezul nopții. Orele de mai jos sunt calculate pentru
# EST (ora standard de iarnă, UTC-5) — vara (EDT, UTC-4), din cauza
# schimbării orei, rulările vor cădea cu o oră mai devreme față de
# intenția inițială. GitHub Actions nu ajustează automat cron-ul la
# ora de vară — dacă vrei precizie exactă tot anul, cron-ul de mai jos
# trebuie actualizat manual de 2 ori pe an.
#
#   1. Înainte de deschidere (9:00 ET / 14:00 UTC)
#   2. Prânz (12:00 ET / 17:00 UTC)
#   3. Ora 15:00 (15:00 ET / 20:00 UTC)
#   4. Imediat după închidere (16:15 ET / 21:15 UTC)
#   5. Miezul nopții (00:00 ET / 05:00 UTC)
#
# Poate fi pornit și manual din tab-ul "Actions" (buton "Run workflow").
on:
  schedule:
    - cron: '0 14 * * *'
    - cron: '0 17 * * *'
    - cron: '0 20 * * *'
    - cron: '15 21 * * *'
    - cron: '0 5 * * *'
  workflow_dispatch: {}

# "contents: write" e necesar ca job-ul să poată face commit + push
# înapoi în repository (baza de date actualizată + raportul nou).
permissions:
  contents: write

# Grup de concurență COMUN cu weekly_backfill.yml — cele două
# workflow-uri scriu în aceleași fișiere (data/, docs/), deci GitHub
# le pune la coadă în loc să le lase să ruleze în paralel.
concurrency:
  group: marketlens-data-write
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily pipeline
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python run_daily.py

      - name: Commit and push updated data + report
        run: |
          git config user.name "marketlens-bot"
          git config user.email "actions@github.com"
          git add data/ docs/
          git diff --staged --quiet || git commit -m "Actualizare automată $(date -u +'%Y-%m-%d %H:%M UTC')"

          # Calea rapidă, obișnuită: rebase curat peste orice a ajuns
          # între timp pe main.
          if git pull --rebase origin main; then
            git push
          else
            # Conflict — de obicei pe data/marketlens.db sau
            # docs/index.html (fișiere REGENERATE integral la fiecare
            # rulare, nu editate incremental, deci nu se pot combina
            # linie cu linie ca un fișier text obișnuit). In loc sa
            # esuam si sa cerem interventie manuala, pastram automat
            # versiunea proaspat generata de rularea curenta — orice
            # articol colectat exclusiv de rularea concurenta, in
            # fereastra scurta de suprapunere, va fi recolectat oricum
            # la rularea urmatoare (RSS-urile arata istoric recent, nu
            # doar strict-nou).
            echo "Conflict la rebase — pastram versiunea proaspat generata de aceasta rulare."
            git rebase --abort || true
            git fetch origin main
            git merge -X ours origin/main --no-edit -m "Merge automat (rezolvare conflict pe fisiere regenerate)"
            git push
          fi
