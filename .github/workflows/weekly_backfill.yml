name: MarketLens Weekly Historical Backfill

# Rulează automat în fiecare duminică, la 06:00 UTC (înaintea rulării
# zilnice normale), și poate fi pornit și manual din tab-ul "Actions".
on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch: {}

permissions:
  contents: write

# Grup de concurență COMUN cu daily.yml — vezi explicația din acel
# fișier. Fără asta, cele două workflow-uri pot ajunge să scrie în
# aceleași fișiere aproape simultan și una din scrieri e respinsă.
concurrency:
  group: marketlens-data-write
  cancel-in-progress: false

jobs:
  run-backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly backfill + daily pipeline
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: python run_weekly_backfill.py

      - name: Commit and push updated data + report
        run: |
          git config user.name "marketlens-bot"
          git config user.email "actions@github.com"
          git add data/ docs/
          git diff --staged --quiet || git commit -m "Actualizare săptămânală (backfill istoric) $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
