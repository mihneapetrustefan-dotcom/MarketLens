name: MarketLens Weekly Historical Backfill

# Rulează de 2 ori pe săptămână (duminică și miercuri, 06:00 UTC),
# plus poate fi pornit manual din tab-ul "Actions".
on:
  schedule:
    - cron: '0 6 * * 0'
    - cron: '0 6 * * 3'
  workflow_dispatch: {}

permissions:
  contents: write

# Grup de concurență COMUN cu daily.yml — vezi explicația din acel
# fișier.
concurrency:
  group: marketlens-data-write
  cancel-in-progress: false

jobs:
  run-backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly backfill + daily pipeline
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python run_weekly_backfill.py

      - name: Commit and push updated data + report
        run: |
          git config user.name "marketlens-bot"
          git config user.email "actions@github.com"
          git add data/ docs/
          git diff --staged --quiet || git commit -m "Actualizare (backfill istoric) $(date -u +'%Y-%m-%d %H:%M UTC')"

          if git pull --rebase origin main; then
            git push
          else
            echo "Conflict la rebase — pastram versiunea proaspat generata de aceasta rulare."
            git rebase --abort || true
            git fetch origin main
            git merge -X ours origin/main --no-edit -m "Merge automat (rezolvare conflict pe fisiere regenerate)"
            git push
          fi
