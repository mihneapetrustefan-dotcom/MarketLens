name: EMERGENCY - Archive Old Articles

# Rulare MANUALA — arhiveaza articolele mai vechi de 60 de zile in
# fisiere comprimate (data/archives/), sters din tabelul live doar
# DUPA ce arhivarea a reusit. Istoricul ramane 100% disponibil pentru
# Faza 7 (cercetare istorica) — nu se pierde nimic, doar se muta.
#
# Fereastra e 60 de zile (nu 180): diagnosticul a aratat ca majoritatea
# articolelor sunt recente (generate de cele 5 rulari zilnice), asa ca
# o fereastra de 180 de zile elibera aproape nimic.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Archive old articles
        run: python scripts/archive_old_articles.py --keep-days 60

      - name: Commit and push the archive + smaller database
        run: |
          git config user.name "marketlens-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Emergency: archive old articles, shrink live database"
          git pull --rebase origin main
          git push
